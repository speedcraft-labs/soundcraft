name: Hosted CI
on:
  push:
    branches: [main, algo/ci]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install native dependencies
        run: |
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          install_native_dependencies() {
            sudo env DEBIAN_FRONTEND=noninteractive timeout -k 15 300 apt-get "${apt_options[@]}" update &&
              sudo env DEBIAN_FRONTEND=noninteractive timeout -k 15 600 apt-get "${apt_options[@]}" install -y --no-install-recommends \
                libasound2-dev libudev-dev pkg-config libdbus-1-dev libssl-dev libgtk-3-dev \
                libwebkit2gtk-4.1-dev fonts-noto-cjk fonts-unifont
          }
          for attempt in 1 2; do
            if install_native_dependencies; then
              exit 0
            fi
            echo "Native dependency installation attempt ${attempt} failed; repairing dpkg state before retry."
            sudo dpkg --configure -a || true
          done
          exit 1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - name: Workspace tests
        run: cargo test --workspace --no-fail-fast
